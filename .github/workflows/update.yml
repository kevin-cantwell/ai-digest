name: Update Digest

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:      # allow manual trigger

concurrency:
  group: update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests feedparser anthropic

      - name: Run fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch.py

      - name: Commit and push
        run: |
          git config user.name "Clarion Bot"
          git config user.email "clarion@clarionbot.local"
          git add index.html feed.xml
          git diff --staged --quiet || git commit -m "digest: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
